
server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - StripPrefix=2
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
      - id: identity-service
        uri: http://localhost:8080
        predicates:
        - Path=${app.api-prefix}/identity/**

      - id: profile-service
        uri: http://localhost:8081
        predicates:
        - Path=${app.api-prefix}/profile/users/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG



